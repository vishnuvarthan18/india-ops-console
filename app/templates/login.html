{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block bare %}
<div class="login-wrap">
  <div class="login">
    <div class="brand">
      <span class="mark" aria-hidden="true">i</span>
      <span>India Data Platform<span class="sub">Ops console</span></span>
    </div>
    {% if error %}<div class="alert-inline" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <label><span>Username</span>
        <input name="username" autocomplete="username" autofocus required></label>
      <label><span>Password</span>
        <input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn btn-primary" type="submit" data-busy="Signing in…">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
